name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  python-coverage:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            python: dydo/_system/.local/static-gates/python/bin/python
          - os: windows-latest
            platform: windows
            python: dydo/_system/.local/static-gates/python/Scripts/python.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: DynaDocs.Tests/coverage/.python-version

      - uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dydo-assurance-dotnet
        with:
          dotnet-version: '10.0.303'

      - name: Provision patched .NET runtime
        shell: pwsh
        run: ./.github/workflows/provision-dotnet-runtime.ps1

      - name: Prepare pinned Python assurance environment
        run: python -m venv dydo/_system/.local/static-gates/python

      - name: Install locked Python dependencies
        run: ${{ matrix.python }} -m pip install -r DynaDocs.Tests/coverage/requirements.lock

      - name: Install locked coverage dependencies
        run: npm ci --prefix DynaDocs.Tests/coverage

      - name: Prepare native evidence directories
        shell: bash
        run: mkdir -p DynaDocs.Tests/coverage/results/native-jobs DynaDocs.Tests/coverage/results/native-lifetime

      - name: Preflight candidate, pins, dependencies and nonzero discovery
        shell: bash
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_REF_SHA: ${{ github.sha }}
        run: |
          "${{ matrix.python }}" - <<'PY'
          import json, os, platform, subprocess, sys, unittest
          from pathlib import Path
          tools = Path('DynaDocs.Tests/coverage')
          sys.path.insert(0, str(tools.resolve()))
          from gate_versions import javascript_versions, python_versions
          candidate = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          assert not subprocess.check_output(['git', 'status', '--porcelain']), 'Dirty PR candidate'
          versions = python_versions(tools)
          assert platform.python_version() == versions['declared_runtime']
          assert subprocess.check_output(['node', '--version'], text=True).strip() == 'v26.13.0'
          javascript_versions(tools)
          loader = unittest.TestLoader()
          suite = loader.discover(str(tools / 'tests'), pattern='test_*.py')
          assert not loader.errors, loader.errors
          def cases(suite):
              for item in suite:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item
          ids = [case.id() for case in cases(suite)]
          counts = {name: sum(value.startswith(name + '.') for value in ids) for name in
                    ('test_windows_job', 'test_windows_cancellation', 'test_control_dydo_lifetime')}
          assert ids and all(counts.values()), counts
          receipt = {'candidate': candidate, 'checkout_tree': tree, 'pr_head_sha': os.environ['PR_HEAD_SHA'],
                     'merge_ref_sha': os.environ['MERGE_REF_SHA'], 'python': versions,
                     'tests': len(ids), 'native_tests': counts}
          (tools / 'results/preflight.json').write_text(json.dumps(receipt, indent=2), encoding='utf-8')
          print(json.dumps(receipt))
          PY

      - name: Full Python suite and platform coverage gate
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          DYDO_NATIVE_TEST_EVIDENCE: DynaDocs.Tests/coverage/results/native-jobs
          DYDO_LIFETIME_EVIDENCE: DynaDocs.Tests/coverage/results/native-lifetime
          DYDO_CANCELLATION_EVIDENCE: DynaDocs.Tests/coverage/results/windows-cancellation
        run: ${{ matrix.python }} DynaDocs.Tests/coverage/gap_check.py gate coverage --stack python

      - name: Canonical Python static gate
        if: ${{ !cancelled() && matrix.platform == 'linux' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: ${{ matrix.python }} DynaDocs.Tests/coverage/gap_check.py gate static --stack python

      - name: Upload platform coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage-${{ matrix.platform }}
          path: DynaDocs.Tests/coverage/results
          if-no-files-found: error

  python-coverage-union:
    needs: python-coverage
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: DynaDocs.Tests/coverage/.python-version

      - name: Install locked union analysis dependencies
        run: python -m pip install -r DynaDocs.Tests/coverage/requirements.lock

      - uses: actions/download-artifact@v4
        with:
          pattern: python-coverage-*
          path: DynaDocs.Tests/coverage/results/coverage-platforms

      - name: Require both native jobs to pass
        if: always()
        shell: bash
        env:
          PLATFORM_RESULT: ${{ needs.python-coverage.result }}
        run: |
          mkdir -p DynaDocs.Tests/coverage/results/coverage-platforms
          echo "$PLATFORM_RESULT" > DynaDocs.Tests/coverage/results/coverage-platforms/native-job-result.txt
          test "$PLATFORM_RESULT" = success

      - name: Verify complete same-candidate platform union
        run: >-
          python DynaDocs.Tests/coverage/python_platform.py
          --linux DynaDocs.Tests/coverage/results/coverage-platforms/python-coverage-linux/adapters/python-coverage.json
          --windows DynaDocs.Tests/coverage/results/coverage-platforms/python-coverage-windows/adapters/python-coverage.json
          --output DynaDocs.Tests/coverage/results/coverage-platforms/union.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage-union
          path: DynaDocs.Tests/coverage/results/coverage-platforms
          if-no-files-found: error

  assurance-cancellation:
    strategy:
      fail-fast: false
      matrix:
        # CPython 3.14.4 has a hosted build for Ubuntu 24.04, not 26.04.
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: DynaDocs.Tests/coverage/.python-version

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'

      - name: Install locked assurance dependencies
        run: python -m pip install -r DynaDocs.Tests/coverage/requirements.lock

      - name: Install locked coverage dependencies
        run: npm ci --prefix DynaDocs.Tests/coverage

      - name: Native cancellation regression
        env:
          PYTHONPATH: DynaDocs.Tests/coverage/tests
          DYDO_CANCELLATION_EVIDENCE: DynaDocs.Tests/coverage/results/windows-cancellation
        run: python -m unittest -v test_windows_cancellation test_windows_job test_gate_adapter.CoverageCancellationTests

      - name: Upload cancellation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cancellation-${{ matrix.os }}
          path: DynaDocs.Tests/coverage/results/windows-cancellation
          if-no-files-found: warn

  viewer:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install viewer dependencies
        run: pnpm -C viewer install --frozen-lockfile

      - name: Typecheck
        run: pnpm -C viewer run typecheck

      - name: Lint
        run: pnpm -C viewer run lint

      - name: Test
        run: pnpm -C viewer run test

      - name: Coverage
        run: pnpm -C viewer run coverage

      - name: Build
        run: pnpm -C viewer run build

      - name: Install Playwright Chromium
        run: pnpm -C viewer exec playwright install --with-deps chromium

      - name: E2E
        run: pnpm -C viewer run e2e

      - name: Upload viewer bundle
        uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist
          if-no-files-found: error

  build:
    needs: viewer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download viewer bundle
        uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dydo-assurance-dotnet
        with:
          dotnet-version: '10.0.303'

      - name: Provision patched .NET runtime
        shell: pwsh
        run: ./.github/workflows/provision-dotnet-runtime.ps1

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --warnaserror

      - name: Test
        run: dotnet test --no-build --verbosity normal

  full-stack:
    needs: viewer
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download viewer bundle
        uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dydo-assurance-dotnet
        with:
          dotnet-version: '10.0.303'

      - name: Provision patched .NET runtime
        shell: pwsh
        run: ./.github/workflows/provision-dotnet-runtime.ps1

      - name: Publish dydo (linux-x64)
        run: dotnet publish DynaDocs.csproj -c Release -r linux-x64 -o artifacts/map-e2e

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26.13.0'
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install viewer dependencies
        run: pnpm -C viewer install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm -C viewer exec playwright install --with-deps chromium

      - name: Full-stack E2E
        run: pnpm -C viewer run e2e:full-stack
