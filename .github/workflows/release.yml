name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  viewer:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Install viewer dependencies
        run: pnpm -C viewer install --frozen-lockfile

      - name: Build viewer bundle
        run: pnpm -C viewer run build

      - name: Upload viewer bundle
        uses: actions/upload-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist
          if-no-files-found: error

  build:
    needs: viewer
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: dydo-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: dydo-linux-x64.tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: dydo-linux-arm64.tar.gz
            cross: true
          - os: macos-15
            rid: osx-x64
            artifact: dydo-osx-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact: dydo-osx-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Download viewer bundle
        uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc-aarch64-linux-gnu

      - name: Publish AOT
        run: dotnet publish DynaDocs.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}
        shell: pwsh

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czvf ${{ matrix.artifact }} -C publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  validation:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download viewer bundle
        uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: 'DynaDocs.Tests/coverage/.python-version'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dydo-assurance-dotnet
        with:
          dotnet-version: '10.0.300'

      - name: Verify .NET SDK
        run: if ((dotnet --version) -ne '10.0.300') { throw 'Expected .NET SDK 10.0.300.' }

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
          cache-dependency-path: viewer/pnpm-lock.yaml

      - name: Create Python assurance environment
        run: python -m venv dydo/_system/.local/static-gates/python

      - name: Install Python assurance toolchain
        run: dydo/_system/.local/static-gates/python/Scripts/python.exe -m pip install -r DynaDocs.Tests/coverage/requirements.lock

      - name: Restore AltCover
        run: dotnet tool restore --tool-manifest .config/dotnet-tools.json

      - name: Restore coverage metrics
        run: dotnet restore DynaDocs.Tests/coverage/metrics/GateMetrics.csproj --locked-mode

      - name: Install Node assurance toolchain
        run: npm ci
        working-directory: DynaDocs.Tests/coverage

      - name: Install viewer dependencies
        run: pnpm -C viewer install --frozen-lockfile

      - name: Run isolated test adapter
        run: dydo/_system/.local/static-gates/python/Scripts/python.exe DynaDocs.Tests/coverage/run_tests.py

      - name: Build release with warnings as errors
        run: dotnet build DynaDocs.sln -c Release --warnaserror

      - name: Check documentation
        run: dotnet run --project DynaDocs.csproj -c Release --no-build -- check

      - name: Run coverage gate
        run: dydo/_system/.local/static-gates/python/Scripts/python.exe DynaDocs.Tests/coverage/gap_check.py --force-run

      # The gate's per-row reports, command logs and campaign streams, so a failed row carries its detail.
      - name: Upload coverage evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: validation-coverage-evidence
          path: |
            DynaDocs.Tests/coverage/results/**
            DynaDocs.Tests/TestResults/**
          if-no-files-found: warn

  release:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v3.1.0' }}
    needs: [build, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # The binaries only; the viewer-dist bundle is already embedded in them.
          pattern: dydo-*
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create stable release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: false

  nuget:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v3.1.0' }}
    needs: [build, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - name: Download viewer bundle
        uses: actions/download-artifact@v4
        with:
          name: viewer-dist
          path: viewer/dist

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack DynaDocs.csproj -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o nupkg

      - name: NuGet login (OIDC)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: balazsbodnar

      - name: Push to NuGet
        run: dotnet nuget push nupkg/dydo.${{ steps.version.outputs.VERSION }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v3.1.0' }}
    needs: [build, validation, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
        working-directory: npm

      - name: Publish to npm
        run: npm publish --access public --provenance --tag latest
        working-directory: npm
