name: Release

on:
  push:
    branches:
      - feature/dydo-3-consolidation
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: dydo-win-x64.zip
          - os: ubuntu-latest
            rid: linux-x64
            artifact: dydo-linux-x64.tar.gz
          - os: ubuntu-latest
            rid: linux-arm64
            artifact: dydo-linux-arm64.tar.gz
            cross: true
          - os: macos-15
            rid: osx-x64
            artifact: dydo-osx-x64.tar.gz
          - os: macos-latest
            rid: osx-arm64
            artifact: dydo-osx-arm64.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install cross-compilation toolchain (Linux ARM64)
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm gcc-aarch64-linux-gnu

      - name: Publish AOT
        run: dotnet publish DynaDocs.csproj -c Release -r ${{ matrix.rid }} --self-contained -o publish

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path publish/* -DestinationPath ${{ matrix.artifact }}
        shell: pwsh

      - name: Package (Unix)
        if: matrix.os != 'windows-latest'
        run: tar -czvf ${{ matrix.artifact }} -C publish .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  validation:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Python assurance toolchain
        run: python -m pip install -r DynaDocs.Tests/coverage/requirements.lock

      - name: Install Node assurance toolchain
        run: npm ci
        working-directory: DynaDocs.Tests/coverage

      - name: Run isolated test adapter
        run: python DynaDocs.Tests/coverage/run_tests.py

      - name: Build release with warnings as errors
        run: dotnet build DynaDocs.sln -c Release --warnaserror

      - name: Check documentation
        run: dotnet run --project DynaDocs.csproj -c Release --no-build -- check

      - name: Run coverage gate
        run: python DynaDocs.Tests/coverage/gap_check.py --force-run

      - name: Run mutation gate
        run: python DynaDocs.Tests/coverage/gap_check.py gate mutation --since 2e31b1d0915529926a79224424c18620ee8003e1

  release:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/tags/v3.0.0-beta.3' || github.ref == 'refs/tags/v3.0.0') }}
    needs: [build, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create beta release
        if: github.ref == 'refs/tags/v3.0.0-beta.3'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: true

      - name: Create stable release
        if: github.ref == 'refs/tags/v3.0.0'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: false

  nuget:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/tags/v3.0.0-beta.3' || github.ref == 'refs/tags/v3.0.0') }}
    needs: [build, validation]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: nuget

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Pack
        run: dotnet pack DynaDocs.csproj -c Release -p:Version=${{ steps.version.outputs.VERSION }} -o nupkg

      - name: NuGet login (OIDC)
        uses: nuget/login@v1
        id: nuget-login
        with:
          user: balazsbodnar

      - name: Push to NuGet
        run: dotnet nuget push nupkg/dydo.${{ steps.version.outputs.VERSION }}.nupkg --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

  npm:
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/tags/v3.0.0-beta.3' || github.ref == 'refs/tags/v3.0.0') }}
    needs: [build, validation, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: npm

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version
        working-directory: npm

      - name: Publish to npm
        run: npm publish --access public --provenance --tag ${{ github.ref == 'refs/tags/v3.0.0-beta.3' && 'beta' || 'latest' }}
        working-directory: npm
